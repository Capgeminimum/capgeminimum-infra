replicaCount: 1

image:
  registry: docker.io
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "15-alpine"

service:
  type: ClusterIP
  port: 5432
  targetPort: 5432

database:
  name: capgeminimum
  user: capgeminimum_user
  password: changeme123

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  mountPath: /var/lib/postgresql/data
  subPath: postgres
  storageClassName: null
  accessMode: ReadWriteOnce

livenessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pg_isready -U {{ .Values.database.user }}
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pg_isready -U {{ .Values.database.user }}
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

podSecurityContext:
  fsGroup: 999

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  allowPrivilegeEscalation: true

imagePullSecrets: []

serviceAccountName: ""

podAnnotations: {}

nodeSelector: {}

affinity: {}

tolerations: []
