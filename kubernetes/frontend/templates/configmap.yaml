{{- if .Values.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend-react-native.fullname" . }}-config
  labels:
    {{- include "frontend-react-native.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  {{- with .Values.env }}
  {{- range . }}
  {{ .name }}: {{ .value | quote }}
  {{- end }}
  {{- end }}
{{- end }}